<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Change Class</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --cream:#F7F5F0; --grey:#6B7280; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--cream); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; padding:30px 22px; }
  h1{ font-family:'Fraunces',serif; color:var(--navy); font-size:20px; margin-bottom:16px; }
  label{ font-size:12.5px; font-weight:600; color:var(--navy); display:block; margin:14px 0 6px; }
  select{ width:100%; padding:13px; border-radius:12px; border:1.5px solid #E3E1DB; font-size:14px; background:white; }
  .btn{ width:100%; background:var(--navy); color:white; border:none; padding:14px; border-radius:14px; font-weight:700; font-size:14px; margin-top:20px; cursor:pointer; }
  .msg{ font-size:12.5px; margin-top:12px; text-align:center; color:#2E8B57; }
</style>
</head>
<body>
<script>if(localStorage.getItem('nw_dark_mode')==='1')document.body.classList.add('dark');</script>
<div class="phone">
  <h1>Change Class / Exam</h1>
  <label>Class</label>
  <select id="classSelect">
    <option value="">Select class</option>
    <script>for(let i=1;i<=12;i++) document.write(`<option value="${i}">Class ${i}</option>`);</script>
  </select>
  <label>Board</label>
  <select id="boardSelect">
    <option value="CBSE">CBSE</option>
    <option value="ICSE">ICSE</option>
    <option value="State Board">State Board</option>
  </select>
  <label>Medium</label>
  <select id="mediumSelect">
    <option value="English">English</option>
    <option value="Hindi">Hindi</option>
    <option value="Urdu">Urdu</option>
  </select>
  <button class="btn" id="saveBtn" onclick="saveClass()">Save & Switch</button>
  <div class="msg" id="msg"></div>
</div>
<script>
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
    if (profile) {
      document.getElementById('classSelect').value = profile.class_selected || '';
      document.getElementById('boardSelect').value = profile.board || 'CBSE';
      document.getElementById('mediumSelect').value = profile.medium || 'English';
    }
  })();

  async function saveClass(){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    const btn = document.getElementById('saveBtn');
    btn.disabled = true; btn.textContent = 'Saving...';
    await supabaseClient.from('profiles').update({
      class_selected: document.getElementById('classSelect').value,
      board: document.getElementById('boardSelect').value,
      medium: document.getElementById('mediumSelect').value
    }).eq('id', session.user.id);
    document.getElementById('msg').textContent = 'Saved! Redirecting to Home...';
    setTimeout(() => window.location.href = 'index.html', 1200);
  }
</script>
</body>
</html>
