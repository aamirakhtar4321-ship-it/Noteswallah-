<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Test</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --navy-light:#1D3560; --gold:#E8A33D; --gold-light:#F6D9A6; --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --red:#C0392B; --purple:#8E44AD; --green:#2E8B57; --radius:16px; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; padding-bottom:130px; position:relative; }
  h1{ font-family:'Fraunces',serif; }
  .topbar{ background:var(--navy); color:white; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; }
  .q-progress{ font-size:13px; font-weight:600; opacity:0.85; }
  .timer{ background:rgba(255,255,255,0.12); padding:7px 14px; border-radius:20px; font-weight:700; font-size:14px; }
  .timer.warning{ background:var(--red); }
  .palette-strip{ display:flex; gap:7px; padding:12px 18px; overflow-x:auto; background:white; box-shadow:var(--shadow); }
  .p-item{ min-width:32px; height:32px; border-radius:8px; background:#EEE; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--grey); flex-shrink:0; cursor:pointer; }
  .p-item.answered{ background:var(--green); color:white; }
  .p-item.marked{ background:var(--purple); color:white; }
  .p-item.current{ outline:2.5px solid var(--gold); }
  .content{ padding:20px 18px; }
  .q-card{ background:white; border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; }
  .q-text{ font-size:15.5px; font-weight:600; line-height:1.5; margin-bottom:18px; }
  .option{ display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:12px; border:1.5px solid #E8E6E0; margin-bottom:10px; cursor:pointer; font-size:14px; }
  .option.selected{ border-color:var(--navy); background:#F0F3FA; }
  .opt-letter{ width:26px; height:26px; border-radius:50%; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--navy); flex-shrink:0; }
  .option.selected .opt-letter{ background:var(--navy); color:white; }
  .bottom-controls{ position:fixed; bottom:0; width:100%; max-width:430px; background:white; box-shadow:0 -4px 16px rgba(0,0,0,0.06); padding:12px 18px 18px; }
  .control-row{ display:flex; gap:8px; margin-bottom:8px; }
  .ctrl-btn{ flex:1; padding:12px; border-radius:12px; font-size:12.5px; font-weight:700; border:none; cursor:pointer; text-align:center; }
  .ctrl-btn.mark{ background:var(--gold-light); color:#8A5A00; }
  .ctrl-btn.next{ background:var(--navy); color:white; }
  .ctrl-btn.prev{ background:#EEE; color:var(--grey); }
  .submit-btn{ width:100%; background:var(--red); color:white; border:none; padding:12px; border-radius:12px; font-size:13px; font-weight:700; cursor:pointer; }
  .empty{ text-align:center; padding:60px 20px; color:var(--grey); font-size:13px; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="q-progress" id="qProgress">Loading...</div>
    <div class="timer" id="timerDisplay">⏱ --:--</div>
  </div>
  <div class="palette-strip" id="paletteStrip"></div>
  <div class="content"><div class="q-card" id="qCard"><p>Loading questions...</p></div></div>
  <div class="bottom-controls">
    <div class="control-row">
      <button class="ctrl-btn prev" onclick="goPrev()">← Previous</button>
      <button class="ctrl-btn mark" onclick="markReview()">🚩 Mark</button>
      <button class="ctrl-btn next" onclick="goNext()">Next →</button>
    </div>
    <button class="submit-btn" onclick="submitTest()">Submit Test</button>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const chapterId = params.get('chapter_id');
  let questions = [], current = 0, answers = [], marked = [], timeLeft = 1200, timerInterval, chapterTitle = '';

  (async () => {
    if (!chapterId) { document.getElementById('qCard').innerHTML = '<div class="empty">No chapter selected.</div>'; return; }
    const { data: chapter } = await supabaseClient.from('chapters').select('title').eq('id', chapterId).single();
    chapterTitle = chapter?.title || 'Chapter Test';
    const { data: qs } = await supabaseClient.from('questions').select('*').eq('chapter_id', chapterId);
    if (!qs || qs.length === 0) {
      document.getElementById('qCard').innerHTML = `<div class="empty">No test questions added yet for "${chapterTitle}". Check back soon!</div>`;
      document.getElementById('qProgress').textContent = chapterTitle;
      return;
    }
    questions = qs;
    answers = new Array(questions.length).fill(null);
    marked = new Array(questions.length).fill(false);
    render();
    startTimer();
  })();

  function renderPalette(){
    const strip = document.getElementById('paletteStrip');
    strip.innerHTML = '';
    questions.forEach((q, i) => {
      const item = document.createElement('div');
      item.className = 'p-item';
      if (i === current) item.classList.add('current');
      if (marked[i]) item.classList.add('marked');
      else if (answers[i] !== null) item.classList.add('answered');
      item.textContent = i + 1;
      item.onclick = () => { current = i; render(); };
      strip.appendChild(item);
    });
  }

  function render(){
    document.getElementById('qProgress').textContent = `${chapterTitle} — Q${current+1}/${questions.length}`;
    const q = questions[current];
    const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
    let html = `<div class="q-text">${q.question_text}</div>`;
    opts.forEach((opt, i) => {
      html += `<div class="option ${answers[current]===i?'selected':''}" onclick="selectAnswer(${i})"><div class="opt-letter">${String.fromCharCode(65+i)}</div><div>${opt}</div></div>`;
    });
    document.getElementById('qCard').innerHTML = html;
    renderPalette();
  }

  function selectAnswer(i){ answers[current] = i; render(); }
  function goNext(){ if(current < questions.length-1){ current++; render(); } }
  function goPrev(){ if(current > 0){ current--; render(); } }
  function markReview(){ marked[current] = !marked[current]; render(); }

  function startTimer(){
    const timerEl = document.getElementById('timerDisplay');
    timerInterval = setInterval(() => {
      timeLeft--;
      const m = Math.floor(timeLeft/60), s = timeLeft%60;
      timerEl.textContent = `⏱ ${m}:${s<10?'0':''}${s}`;
      if (timeLeft <= 120) timerEl.classList.add('warning');
      if (timeLeft <= 0){ clearInterval(timerInterval); submitTest(); }
    }, 1000);
  }

  async function submitTest(){
    clearInterval(timerInterval);
    let score = 0;
    questions.forEach((q,i) => { if(answers[i] === q.correct_option) score++; });
    localStorage.setItem('nw_lastScore', score);
    localStorage.setItem('nw_lastTotal', questions.length);
    localStorage.setItem('nw_lastAnswers', JSON.stringify(answers));
    localStorage.setItem('nw_lastChapterId', chapterId);
    localStorage.setItem('nw_lastChapterTitle', chapterTitle);
    window.location.href = 'result.html';
  }
</script>
</body>
</html>
