<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Subjects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --green:#2E8B57; --radius:16px; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; background:var(--cream); padding-bottom:90px; }
  h1{ font-family:'Fraunces', serif; }
  .topbar{ background:var(--navy); color:white; padding:16px 20px 20px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; text-decoration:none; color:white; }
  .topbar h1{ font-size:20px; font-weight:600; }
  .topbar p{ font-size:12.5px; color:#F6D9A6; margin-top:2px; }
  .content{ padding:18px; }
  .subject-card{ background:white; border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; display:flex; align-items:center; gap:14px; margin-bottom:12px; text-decoration:none; color:var(--ink); }
  .subject-icon{ width:48px; height:48px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; font-family:'Fraunces',serif; }
  .subject-info{ flex:1; }
  .subject-info h4{ font-size:15.5px; font-weight:600; }
  .subject-info p{ font-size:12px; color:var(--grey); margin-top:3px; }
  .chevron{ color:var(--grey); font-size:18px; }
  .empty{ text-align:center; padding:50px 20px; color:var(--grey); font-size:13px; }
  .bottom-nav{ position:fixed; bottom:0; width:100%; max-width:430px; background:white; border-top:1px solid #EEE; display:flex; justify-content:space-around; padding:10px 0 14px; box-shadow:0 -4px 16px rgba(0,0,0,0.05); }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; color:var(--grey); text-decoration:none; }
  .nav-item.active{ color:var(--navy); }
  .nav-icon{ font-size:19px; }

  body.dark{ background:#0B1220; }
  body.dark .phone{ background:#0B1220; }
  body.dark .subject-card, body.dark .bottom-nav{ background:#16213E !important; box-shadow:none; }
  body.dark .subject-card *{ color:#EDEDED !important; }
  body.dark .nav-item{ color:#9BA3B4 !important; }
  .bottom-nav{ justify-content:space-between; padding:10px 18px 14px; align-items:center; }
  .nav-center{ display:flex; align-items:center; justify-content:center; width:50px; height:50px; border-radius:50%; background:var(--navy); color:white; margin-top:-26px; box-shadow:0 6px 14px rgba(19,34,66,0.35); text-decoration:none; flex-shrink:0; }

  /* UNIVERSAL DARK MODE FIX — overrides core color variables so ALL text using them auto-fixes */
  body.dark{ --cream:#0B1220 !important; --ink:#EDEDED !important; --grey:#9BA3B4 !important; background:#0B1220 !important; }
  body.dark .phone{ background:#0B1220 !important; }
  body.dark .streak-card, body.dark .continue-card, body.dark .test-card, body.dark .rec-card,
  body.dark .challenge-card.weekly, body.dark .quick-item, body.dark .bottom-nav, body.dark .subject-card,
  body.dark .chapter-card, body.dark .note-body, body.dark .stat-box, body.dark .menu-card,
  body.dark .cert-card, body.dark .note-card, body.dark .attempt-card, body.dark .intro-card,
  body.dark .bubble.sara, body.dark .q-card, body.dark .q-block, body.dark .cert-frame,
  body.dark .card, body.dark .info-card{ background:#16213E !important; box-shadow:none !important; border-color:#243256 !important; }
  body.dark .nav-item{ color:#9BA3B4 !important; }
  body.dark .nav-item.active{ color:#EDEDED !important; }
</style>
</head>
<body>
<script>if(localStorage.getItem('nw_dark_mode')==='1')document.body.classList.add('dark');</script>
<div class="phone">
  <div class="topbar">
    <a href="index.html" class="back-btn">←</a>
    <div><h1>Notes Library</h1><p id="userClassLine">Class 10 · CBSE</p></div>
  </div>
  <div class="content" id="subjectList"><div class="empty">Loading subjects...</div></div>
</div>
<div class="bottom-nav">
  <a href="subjects.html" class="nav-item"><div class="nav-icon">📚</div>Notes</a>
  <a href="test-start.html" class="nav-item"><div class="nav-icon">📝</div>Test</a>
  <a href="index.html" class="nav-center"><div class="nav-icon">🏠</div></a>
  <a href="doubts.html" class="nav-item"><div class="nav-icon">🤖</div>AI</a>
  <a href="profile.html" class="nav-item"><div class="nav-icon">👤</div>Profile</a>
</div>

<script>
  const ICONS = { 'Mathematics':'Ma', 'Science':'Sc', 'Social Science':'SS', 'English':'En', 'Hindi':'Hi', 'Urdu':'Ur' };
  const COLORS = { 'Mathematics':'#FDE2E2', 'Science':'#DCFCE7', 'Social Science':'#EDE9FE', 'English':'#FEF3C7', 'Hindi':'#DBEAFE', 'Urdu':'#FCE7F3' };
  const TEXTCOLORS = { 'Mathematics':'#C0392B', 'Science':'#166534', 'Social Science':'#6D28D9', 'English':'#92400E', 'Hindi':'#1D4ED8', 'Urdu':'#BE185D' };

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
    const classBoard = profile ? `Class ${profile.class_selected} ${profile.board}` : null;
    if (profile) document.getElementById('userClassLine').textContent = `Class ${profile.class_selected} · ${profile.board}`;

    const { data: subjects } = await supabaseClient.from('subjects').select('*').eq('class_board', classBoard).order('id');
    const list = document.getElementById('subjectList');
    if (!subjects || subjects.length === 0) { list.innerHTML = `<div class="empty">No subjects added yet for ${classBoard || 'your class'}. Check back soon!</div>`; return; }

    list.innerHTML = '';
    const results = await Promise.all(subjects.map(async (subj) => {
      const { count } = await supabaseClient.from('chapters').select('*', { count: 'exact', head: true }).eq('subject_id', subj.id);
      return { subj, count };
    }));
    for (const { subj, count } of results) {
      const a = document.createElement('a');
      a.href = `dynamic-chapters.html?subject_id=${subj.id}`;
      a.className = 'subject-card';
      const bg = COLORS[subj.name] || '#EEE';
      const fg = TEXTCOLORS[subj.name] || 'var(--navy)';
      a.innerHTML = `<div class="subject-icon" style="background:${bg}; color:${fg};">${ICONS[subj.name] || (subj.name||'').slice(0,2)}</div>
        <div class="subject-info"><h4>${subj.name}</h4><p>${count || 0} chapter${count === 1 ? '' : 's'} · notes + tests</p></div>
        <div class="chevron">›</div>`;
      list.appendChild(a);
    }
  })();
</script>
</body>
</html>
