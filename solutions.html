<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --green:#2E8B57; --red:#C0392B; --radius:16px; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; padding-bottom:30px; }
  h1{ font-family:'Fraunces',serif; }
  .topbar{ background:var(--navy); color:white; padding:16px 20px 20px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; cursor:pointer; text-decoration:none; color:white; }
  .topbar h1{ font-size:18px; font-weight:600; }
  .content{ padding:18px; }
  .q-block{ background:white; border-radius:14px; box-shadow:var(--shadow); padding:16px; margin-bottom:12px; }
  .q-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .q-num{ font-size:11.5px; font-weight:700; color:var(--grey); }
  .result-tag{ font-size:10px; font-weight:700; padding:3px 10px; border-radius:8px; }
  .result-tag.correct{ background:#E4F3EA; color:var(--green); }
  .result-tag.wrong{ background:#FBEAE8; color:var(--red); }
  .result-tag.skipped{ background:#F0EEE8; color:var(--grey); }
  .q-text{ font-size:13.5px; font-weight:600; margin-bottom:10px; line-height:1.5; }
  .opt-line{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; font-size:12.5px; margin-bottom:6px; }
  .opt-line.your-wrong{ background:#FBEAE8; color:#8C2A20; }
  .opt-line.correct-answer{ background:#E4F3EA; color:#1B5E3A; }
  .opt-letter{ width:20px; height:20px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; flex-shrink:0; }
  .explanation{ font-size:12px; color:var(--grey); margin-top:8px; padding-top:8px; border-top:1px dashed #E3E1DB; line-height:1.5; }
  .explanation b{ color:var(--navy); }
  .empty{ text-align:center; padding:50px 20px; color:var(--grey); font-size:13px; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <a href="result.html" class="back-btn">←</a>
    <div><h1>Detailed Solutions</h1></div>
  </div>
  <div class="content" id="solutionsArea"><div class="empty">Loading...</div></div>
</div>
<script>
  (async () => {
    const answers = JSON.parse(localStorage.getItem('nw_lastAnswers') || '[]');
    const questions = JSON.parse(localStorage.getItem('nw_lastQuestions') || '[]');
    const area = document.getElementById('solutionsArea');
    if (!questions || questions.length === 0) { area.innerHTML = '<div class="empty">No recent test found.</div>'; return; }

    area.innerHTML = '';
    questions.forEach((q, i) => {
      const userAns = answers[i];
      let tagClass = 'skipped', tagText = 'Skipped';
      if (userAns !== null && userAns !== undefined) {
        if (userAns === q.correct_option) { tagClass = 'correct'; tagText = 'Correct'; }
        else { tagClass = 'wrong'; tagText = 'Incorrect'; }
      }
      const opts = [q.option_a, q.option_b, q.option_c, q.option_d];
      let optionsHtml = '';
      opts.forEach((opt, oi) => {
        let cls = '';
        if (oi === q.correct_option) cls = 'correct-answer';
        if (userAns === oi && oi !== q.correct_option) cls = 'your-wrong';
        optionsHtml += `<div class="opt-line ${cls}"><div class="opt-letter">${String.fromCharCode(65+oi)}</div><div>${opt}${oi===q.correct_option ? ' ✓' : ''}${userAns===oi && oi!==q.correct_option ? ' (your answer)' : ''}</div></div>`;
      });
      const block = document.createElement('div');
      block.className = 'q-block';
      block.innerHTML = `
        <div class="q-header"><div class="q-num">Question ${i+1}</div><div class="result-tag ${tagClass}">${tagText}</div></div>
        <div class="q-text">${q.question_text}</div>
        ${optionsHtml}
        <div class="explanation"><b>Explanation:</b> ${q.explanation || 'No explanation added yet.'}</div>`;
      area.appendChild(block);
    });
  })();
</script>
</body>
</html>
