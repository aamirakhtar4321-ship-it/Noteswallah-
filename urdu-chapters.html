<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Urdu Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132242; --gold:#E8A33D; --gold-light:#F6D9A6; --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --green:#2E8B57;
    --radius:16px; --shadow: 0 4px 16px rgba(19,34,66,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; background:var(--cream); padding-bottom:90px; }
  h1,h2,h3{ font-family:'Fraunces', serif; }
  .urdu-text{ font-family:'Noto Nastaliq Urdu', serif; direction:rtl; }
  .topbar{ background:var(--navy); color:white; padding:16px 20px 20px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; text-decoration:none; color:white; }
  .topbar h1{ font-size:20px; font-weight:600; }
  .topbar p{ font-size:12.5px; color:var(--gold-light); margin-top:2px; }
  .content{ padding:18px; }
  .chapter-card{ background:white; border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; align-items:center; gap:12px; margin-bottom:10px; text-decoration:none; color:var(--ink); }
  .ch-num{ width:34px; height:34px; border-radius:10px; background:var(--cream); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--navy); flex-shrink:0; }
  .ch-info{ flex:1; }
  .ch-info h4{ font-size:16px; font-weight:600; }
  .ch-info .en-sub{ font-size:11px; color:var(--grey); margin-top:2px; }
  .status{ font-size:11.5px; margin-top:3px; }
  .status.unread{ color:var(--grey); }
  .bottom-nav{ position:fixed; bottom:0; width:100%; max-width:430px; background:white; border-top:1px solid #EEE; display:flex; justify-content:space-around; padding:10px 0 14px; box-shadow:0 -4px 16px rgba(0,0,0,0.05); }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; color:var(--grey); text-decoration:none; cursor:pointer; }
  .nav-item.active{ color:var(--navy); }
  .nav-icon{ font-size:19px; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <a href="subjects.html" class="back-btn">←</a>
    <div>
      <h1>Urdu</h1>
      <p>Class 10 · CBSE</p>
    </div>
  </div>
  <div class="content">
    <a href="note-reader.html" class="chapter-card">
      <div class="ch-num">1</div>
      <div class="ch-info">
        <h4 class="urdu-text">نثر کے سبق</h4>
        <div class="en-sub">Prose Lessons</div>
        <div class="status unread">○ Not started</div>
      </div>
    </a>
    <a href="note-reader.html" class="chapter-card">
      <div class="ch-num">2</div>
      <div class="ch-info">
        <h4 class="urdu-text">نظم کے اسباق</h4>
        <div class="en-sub">Poetry Lessons</div>
        <div class="status unread">○ Not started</div>
      </div>
    </a>
    <a href="note-reader.html" class="chapter-card">
      <div class="ch-num">3</div>
      <div class="ch-info">
        <h4 class="urdu-text">قواعد و انشا</h4>
        <div class="en-sub">Grammar & Composition</div>
        <div class="status unread">○ Not started</div>
      </div>
    </a>
  </div>
</div>
<div class="bottom-nav">
  <a href="index.html" class="nav-item"><div class="nav-icon">🏠</div>Home</a>
  <a href="subjects.html" class="nav-item active"><div class="nav-icon">📚</div>Notes</a>
  <a href="test-start.html" class="nav-item"><div class="nav-icon">📝</div>Test Zone</a>
  <a href="doubts.html" class="nav-item"><div class="nav-icon">💬</div>Doubts</a>
  <a href="profile.html" class="nav-item"><div class="nav-icon">👤</div>Profile</a>
</div>
</body>
</html>
