  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132242; --navy-light:#1D3560; --gold:#E8A33D; --gold-light:#F6D9A6;
    --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --green:#2E8B57; --red:#C0392B;
    --radius:16px; --shadow: 0 4px 16px rgba(19,34,66,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; background:var(--cream); padding-bottom:90px; }
  h1,h2,h3{ font-family:'Fraunces', serif; }

  .topbar{
    background:var(--navy); color:white; padding:26px 20px 34px; text-align:center;
    border-radius:0 0 28px 28px;
  }
  .avatar-big{
    width:76px; height:76px; border-radius:50%; background:var(--gold);
    display:flex; align-items:center; justify-content:center; font-size:32px; color:var(--navy);
    margin:0 auto 12px; font-weight:700; font-family:'Fraunces';
  }
  .topbar h1{ font-size:19px; }
  .topbar p{ font-size:12.5px; color:var(--gold-light); margin-top:4px; }

  .content{ padding:18px; margin-top:-18px; }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:16px; }
  .stat-box{ background:white; border-radius:14px; box-shadow:var(--shadow); padding:14px 8px; text-align:center; }
  .stat-box .num{ font-size:17px; font-weight:700; color:var(--navy); font-family:'Fraunces'; }
  .stat-box .lbl{ font-size:10px; color:var(--grey); margin-top:3px; }

  .menu-card{ background:white; border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden; margin-bottom:14px; }
  .menu-item{
    display:flex; align-items:center; gap:12px; padding:14px 16px;
    border-bottom:1px solid #F0EEE8; text-decoration:none; color:var(--ink); cursor:pointer;
  }
  .menu-item:last-child{ border-bottom:none; }
  .menu-icon{ width:34px; height:34px; border-radius:10px; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:15px; }
  .menu-label{ flex:1; font-size:13.5px; font-weight:600; }
  .menu-chevron{ color:var(--grey); font-size:16px; }

  .logout-btn{
    width:100%; padding:13px; background:white; color:var(--red); border:none;
    border-radius:14px; font-weight:700; font-size:13.5px; box-shadow:var(--shadow); cursor:pointer;
  }

  .bottom-nav{
    position:fixed; bottom:0; width:100%; max-width:430px; background:white;
    border-top:1px solid #EEE; display:flex; justify-content:space-around;
    padding:10px 0 14px; box-shadow:0 -4px 16px rgba(0,0,0,0.05);
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; color:var(--grey); text-decoration:none; cursor:pointer; }
  .nav-item.active{ color:var(--navy); }
  .nav-icon{ font-size:19px; }

  body.dark{ background:#0B1220; }
  body.dark .phone{ background:#0B1220; }
  body.dark .stat-box, body.dark .menu-card, body.dark .bottom-nav, body.dark .logout-btn{ background:#16213E !important; box-shadow:none; }
  body.dark .stat-box *, body.dark .menu-item, body.dark .menu-label{ color:#EDEDED !important; }
  body.dark .menu-item{ border-bottom-color:#243256 !important; }
  body.dark .nav-item{ color:#9BA3B4 !important; }
  .bottom-nav{ justify-content:space-between; padding:10px 18px 14px; align-items:center; }
  .nav-center{ display:flex; align-items:center; justify-content:center; width:50px; height:50px; border-radius:50%; background:var(--navy); color:white; margin-top:-26px; box-shadow:0 6px 14px rgba(19,34,66,0.35); text-decoration:none; flex-shrink:0; }
</style>
</head>
<body>
<script>if(localStorage.getItem('nw_dark_mode')==='1')document.body.classList.add('dark');</script>

<div class="phone">
  <div class="topbar">
    <div class="avatar-big" id="avatarLetter">A</div>
    <h1 id="profileName">Loading...</h1>
    <p id="profileMeta">—</p>
  </div>

  <div class="content">
    <div class="stat-grid">
      <div class="stat-box"><div class="num" id="xpNum">0</div><div class="lbl">XP Coins</div></div>
      <div class="stat-box"><div class="num">6</div><div class="lbl">Day Streak</div></div>
      <div class="stat-box"><div class="num">3</div><div class="lbl">Certificates</div></div>
    </div>

    <div class="menu-card">
      <a href="certificates-list.html" class="menu-item"><div class="menu-icon">🏆</div><div class="menu-label">My Certificates</div><div class="menu-chevron">›</div></a>
      <a href="#" class="menu-item"><div class="menu-icon">📄</div><div class="menu-label">My Unlocked Notes</div><div class="menu-chevron">›</div></a>
      <a href="#" class="menu-item"><div class="menu-icon">📊</div><div class="menu-label">Test History</div><div class="menu-chevron">›</div></a>
      <a href="#" class="menu-item"><div class="menu-icon">🔖</div><div class="menu-label">Bookmarked Chapters</div><div class="menu-chevron">›</div></a>
    </div>

    <div class="menu-card">
      <a href="#" class="menu-item"><div class="menu-icon">🌐</div><div class="menu-label">Language — English</div><div class="menu-chevron">›</div></a>
      <a href="#" class="menu-item" onclick="toggleDark(event)"><div class="menu-icon">🌙</div><div class="menu-label">Dark Mode</div><div class="menu-chevron" id="darkStatus">OFF ›</div></a>
      <a href="#" class="menu-item"><div class="menu-icon">🔔</div><div class="menu-label">Notifications</div><div class="menu-chevron">›</div></a>
      <a href="#" class="menu-item"><div class="menu-icon">☁️</div><div class="menu-label">Backup — Last synced just now</div><div class="menu-chevron">›</div></a>
    </div>

    <button class="logout-btn" onclick="doLogout()">Log Out</button>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  async function doLogout(){
    await supabaseClient.auth.signOut();
    window.location.href = "login.html";
  }
  function toggleDark(e){
    e.preventDefault();
    const isDark = localStorage.getItem('nw_dark_mode') === '1';
    localStorage.setItem('nw_dark_mode', isDark ? '0' : '1');
    document.getElementById('darkStatus').textContent = isDark ? 'OFF ›' : 'ON ›';
    alert('Dark Mode ' + (isDark ? 'disabled' : 'enabled') + '. It will apply across the app on next page visit (full rollout to every page happens in a later part — Home page already supports it).');
  }
  if (localStorage.getItem('nw_dark_mode') === '1') document.getElementById('darkStatus').textContent = 'ON ›';

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
    if (profile) {
      document.getElementById('profileName').textContent = profile.name || "Student";
      document.getElementById('avatarLetter').textContent = (profile.name || "S")[0].toUpperCase();
      document.getElementById('profileMeta').textContent =
        (profile.class_selected ? "Class " + profile.class_selected + " · " : "") +
        (profile.board || "") + (profile.medium ? " · " + profile.medium + " Medium" : "");
      document.getElementById('xpNum').textContent = profile.total_xp || 0;
    }
  })();
</script>

<div class="bottom-nav">
  <a href="subjects.html" class="nav-item"><div class="nav-icon">📚</div>Notes</a>
  <a href="test-start.html" class="nav-item"><div class="nav-icon">📝</div>Test</a>
  <a href="index.html" class="nav-center"><div class="nav-icon">🏠</div></a>
  <a href="doubts.html" class="nav-item"><div class="nav-icon">🤖</div>AI</a>
  <a href="profile.html" class="nav-item"><div class="nav-icon">👤</div>Profile</a>
</div>

</body>
</html>
