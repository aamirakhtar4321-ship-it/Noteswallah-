<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Coming Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --cream:#F7F5F0; --grey:#6B7280; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--cream); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; display:flex; flex-direction:column; }
  .topbar{ background:var(--navy); color:white; padding:16px 20px 20px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; text-decoration:none; color:white; }
  .topbar h1{ font-family:'Fraunces',serif; font-size:18px; }
  .center{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:30px; }
  .icon-circle{ width:84px; height:84px; border-radius:50%; background:white; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; font-size:36px; margin-bottom:20px; }
  h2{ font-family:'Fraunces',serif; color:var(--navy); font-size:20px; margin-bottom:8px; }
  p{ color:var(--grey); font-size:13.5px; line-height:1.6; max-width:280px; }
  .btn{ margin-top:24px; background:var(--navy); color:white; border:none; padding:12px 26px; border-radius:14px; font-weight:700; font-size:13.5px; text-decoration:none; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <a href="index.html" class="back-btn">←</a>
    <h1 id="pageTitle">Feature</h1>
  </div>
  <div class="center">
    <div class="icon-circle" id="pageIcon">✨</div>
    <h2>Coming Soon</h2>
    <p>This feature is planned for a future update, after the app is fully published. Stay tuned!</p>
    <a href="index.html" class="btn">Back to Home</a>
  </div>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const feature = params.get('feature') || 'This Feature';
  const icon = params.get('icon') || '✨';
  document.getElementById('pageTitle').textContent = feature;
  document.getElementById('pageIcon').textContent = icon;
</script>
</body>
</html>
