<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Note</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --gold-light:#F6D9A6; --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --green:#2E8B57; --radius:16px; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; background:var(--cream); padding-bottom:90px; }
  h1,h2{ font-family:'Fraunces',serif; }
  .topbar{ background:var(--navy); color:white; padding:16px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:12px; }
  .back-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; text-decoration:none; color:white; }
  .topbar h1{ font-size:16.5px; font-weight:600; }
  .note-body{ background:white; margin:14px 18px; padding:20px; border-radius:var(--radius); box-shadow:var(--shadow); }
  .note-body p{ font-size:14.5px; line-height:1.75; color:#333; white-space:pre-wrap; }
  .empty{ text-align:center; padding:50px 20px; color:var(--grey); font-size:13px; }

  .tab-row{ display:flex; gap:8px; margin:14px 18px 0; }
  .tab-btn{ flex:1; padding:11px; border-radius:12px; text-align:center; font-size:13px; font-weight:700; cursor:pointer; background:white; color:var(--navy); box-shadow:var(--shadow); border:1.5px solid transparent; }
  .tab-btn.active{ border-color:var(--gold); background:#FFF8EC; }
  .tab-panel{ display:none; }
  .tab-panel.show{ display:block; }

  .pro-locked{ margin:14px 18px; background:linear-gradient(135deg,#2B1B4A,#4A2D7A); border-radius:var(--radius); padding:24px 20px; text-align:center; color:white; }
  .pro-locked .lock-icon{ font-size:34px; margin-bottom:10px; }
  .pro-locked h3{ font-family:'Fraunces'; font-size:16px; margin-bottom:6px; }
  .pro-locked p{ font-size:12px; opacity:0.85; line-height:1.6; }
  .pro-locked .unlock-btn{ margin-top:14px; background:var(--gold); color:var(--navy); border:none; padding:11px 22px; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer; }
  .disclaimer-box{ margin:12px 18px 0; background:#FBEAE8; color:#8C2A20; padding:12px 14px; border-radius:12px; font-size:12px; line-height:1.5; display:none; }
  .disclaimer-box.show{ display:block; }
  .no-download-note{ text-align:center; font-size:10.5px; color:var(--grey); margin:10px 18px 0; }

  body.dark{ background:#0B1220; color:#EDEDED; }
  body.dark .note-body, body.dark .q-block, body.dark .stat-box,
  body.dark .cert-frame, body.dark .attempt-card{ background:#16213E !important; color:#EDEDED !important; }
  body.dark .note-body p, body.dark .empty{ color:#C7CCDA !important; }

  /* UNIVERSAL DARK MODE FIX — overrides core color variables so ALL text using them auto-fixes */
  body.dark{ --cream:#0B1220 !important; --ink:#EDEDED !important; --grey:#9BA3B4 !important; background:#0B1220 !important; }
  body.dark .phone{ background:#0B1220 !important; }
  body.dark .streak-card, body.dark .continue-card, body.dark .test-card, body.dark .rec-card,
  body.dark .challenge-card.weekly, body.dark .quick-item, body.dark .bottom-nav, body.dark .subject-card,
  body.dark .chapter-card, body.dark .note-body, body.dark .stat-box, body.dark .menu-card,
  body.dark .cert-card, body.dark .note-card, body.dark .attempt-card, body.dark .intro-card,
  body.dark .bubble.sara, body.dark .q-card, body.dark .q-block, body.dark .cert-frame,
  body.dark .card, body.dark .info-card{ background:#16213E !important; box-shadow:none !important; border-color:#243256 !important; }
  .bottom-nav{ position:fixed; bottom:0; width:100%; max-width:430px; background:white; border-top:1px solid #EEE; display:flex; justify-content:space-around; padding:10px 8px 14px; box-shadow:0 -4px 16px rgba(0,0,0,0.05); }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; font-weight:600; color:var(--grey); text-decoration:none; padding:6px 10px; border-radius:12px; }
  .nav-item.active{ background:#EEF1F8; color:var(--navy); }
  body.dark .nav-item.active{ background:#1D2A47 !important; }
</style>
<script>
  // Prevent easy text/right-click copy on note content (basic deterrent, not foolproof)
  document.addEventListener('contextmenu', e => { if(e.target.closest('.note-body')) e.preventDefault(); });
</script>
</head>
<body>
<script>if(localStorage.getItem('nw_dark_mode')==='1')document.body.classList.add('dark');</script>
<div class="phone">
  <div class="topbar">
    <a href="javascript:history.back()" class="back-btn">←</a>
    <h1 id="chapterTitle">Loading...</h1>
  </div>

  <div class="tab-row">
    <div class="tab-btn active" id="tabNormal" onclick="switchTab('normal')">📖 Normal Notes</div>
    <div class="tab-btn" id="tabPro" onclick="switchTab('pro')">📄 Pro Notes</div>
  </div>

  <div class="tab-panel show" id="panelNormal">
    <div style="margin:14px 18px 0; background:#EEE; color:#999; text-align:center; font-size:10.5px; padding:8px; border-radius:8px;">📢 Banner Ad Space</div>
    <div class="note-body" id="noteContent" style="user-select:none;"><p>Loading note content...</p></div>
    <div class="no-download-note">🔒 View-only inside the app — cannot be downloaded</div>
  </div>

  <div class="tab-panel" id="panelPro"></div>
<div class="bottom-nav">
  <a href="index.html" class="nav-item">
    <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Home</a>
  <a href="subjects.html" class="nav-item">
    <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Notes</a>
  <a href="test-start.html" class="nav-item">
    <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tests</a>
  <a href="doubts.html" class="nav-item">
    <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><circle cx="8.5" cy="14" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r="1.2" fill="currentColor" stroke="none"/><path d="M12 8V4M8 4h8"/></svg>AI</a>
  <a href="profile.html" class="nav-item">
    <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const chapterId = params.get('chapter_id');
  const MAY_1_MONTH = 4; // 0-indexed: May = 4

  function switchTab(tab){
    document.getElementById('tabNormal').classList.toggle('active', tab === 'normal');
    document.getElementById('tabPro').classList.toggle('active', tab === 'pro');
    document.getElementById('panelNormal').classList.toggle('show', tab === 'normal');
    document.getElementById('panelPro').classList.toggle('show', tab === 'pro');
  }

  function isExpiredByAnnualLock(unlockedAtStr){
    const unlockedAt = new Date(unlockedAtStr);
    const now = new Date();
    // This cycle's May 1st
    let cycleMay1 = new Date(now.getFullYear(), MAY_1_MONTH, 1);
    if (now < cycleMay1) cycleMay1.setFullYear(cycleMay1.getFullYear() - 1); // if before May 1 this year, use last year's May 1 as cycle start
    return unlockedAt < cycleMay1;
  }

  (async () => {
    if (!chapterId) return;
    const { data: chapter } = await supabaseClient.from('chapters').select('*').eq('id', chapterId).single();
    if (chapter) document.getElementById('chapterTitle').textContent = chapter.title;

    const { data: note } = await supabaseClient.from('notes').select('*').eq('chapter_id', chapterId).eq('language', 'en').single();
    const noteDiv = document.getElementById('noteContent');
    noteDiv.innerHTML = note && note.content ? `<p>${note.content}</p>` : '<div class="empty">No notes added yet for this chapter. Check back soon!</div>';

    const { data: proNotes } = await supabaseClient.from('professional_notes').select('*').eq('chapter_id', chapterId);
    const proArea = document.getElementById('panelPro');
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (!proNotes || proNotes.length === 0) {
      proArea.innerHTML = '<div class="empty">No Professional Notes added yet for this chapter.</div>';
      return;
    }

    for (const pn of proNotes) {
      let unlocked = false;
      if (session) {
        const { data: unlock } = await supabaseClient.from('user_unlocked_notes').select('*').eq('user_id', session.user.id).eq('professional_note_id', pn.id).maybeSingle();
        if (unlock && !isExpiredByAnnualLock(unlock.unlocked_at)) unlocked = true;
      }

      const card = document.createElement('div');
      if (unlocked) {
        card.innerHTML = `
          <div class="pro-locked" style="background:linear-gradient(135deg,#1B5E3A,#2E8B57);">
            <div class="lock-icon">✅</div>
            <h3>${pn.title}</h3>
            <p>${pn.page_count || '?'} pages · Unlocked this cycle</p>
            <button class="unlock-btn" style="background:white; color:#1B5E3A;" onclick="openPdf('${pn.pdf_url}', '${pn.title}')">Open Notes</button>
          </div>
          <div class="no-download-note">🔒 View-only inside the app — cannot be downloaded</div>`;
      } else {
        card.innerHTML = `
          <div class="pro-locked">
            <div class="lock-icon">🔒</div>
            <h3>${pn.title}</h3>
            <p>${pn.page_count || '?'} pages · Unlock for ${pn.xp_cost} XP · Re-locks every 1 May</p>
            <button class="unlock-btn" onclick="tryUnlock(${pn.id}, ${pn.xp_cost})">Unlock with ${pn.xp_cost} XP</button>
            <button class="unlock-btn" style="background:transparent; color:white; border:1.5px solid rgba(255,255,255,0.4); margin-top:8px;" onclick="startAdUnlock(${pn.id})">▶ Or Watch 3 Ads (Free)</button>
            <div id="adProgress-${pn.id}" style="font-size:11px; opacity:0.85; margin-top:8px; display:none;"></div>
          </div>
          <div class="disclaimer-box" id="disclaimer-${pn.id}">⚠️ Not enough XP yet. Earn XP by completing Daily & Weekly Challenge tests, then come back to unlock this.</div>`;
      }
      proArea.appendChild(card);
    }
  })();

  function openPdf(url, title){
    window.location.href = `pdf-viewer.html?url=${encodeURIComponent(url)}&title=${encodeURIComponent(title)}`;
  }

  async function tryUnlock(noteId, cost){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    const { data: profile } = await supabaseClient.from('profiles').select('total_xp').eq('id', session.user.id).single();
    const disclaimer = document.getElementById(`disclaimer-${noteId}`);
    if (!profile || profile.total_xp < cost) {
      if (disclaimer) disclaimer.classList.add('show');
      return;
    }
    await supabaseClient.from('profiles').update({ total_xp: profile.total_xp - cost }).eq('id', session.user.id);
    await supabaseClient.from('xp_transactions').insert({ user_id: session.user.id, amount: -cost, type: 'spent_unlock_note' });
    await supabaseClient.from('user_unlocked_notes').upsert({ user_id: session.user.id, professional_note_id: noteId, unlocked_at: new Date().toISOString() });
    location.reload();
  }

  let adCounts = {};
  function startAdUnlock(noteId){
    if (!adCounts[noteId]) adCounts[noteId] = 0;
    adCounts[noteId]++;
    const progress = document.getElementById(`adProgress-${noteId}`);
    progress.style.display = 'block';

    if (adCounts[noteId] < 3) {
      progress.textContent = `📺 Ad ${adCounts[noteId]} of 3 watched — tap again for the next ad`;
      alert(`(Placeholder) Simulated ad ${adCounts[noteId]} of 3 would play here. Real video ads will be wired in during the Play Store phase.`);
    } else {
      progress.textContent = `✅ All 3 ads watched — unlocking...`;
      alert('(Placeholder) 3rd ad watched. Unlocking this note for free.');
      unlockViaAds(noteId);
    }
  }

  async function unlockViaAds(noteId){
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    await supabaseClient.from('user_unlocked_notes').upsert({ user_id: session.user.id, professional_note_id: noteId, unlocked_at: new Date().toISOString() });
    location.reload();
  }
</script>
</body>
</html>
