<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --cream:#F7F5F0; --grey:#6B7280; --red:#C0392B; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--cream); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; padding:40px 24px; }
  .logo-wrap{ text-align:center; margin-bottom:40px; }
  .logo-img{ width:64px; height:64px; border-radius:16px; margin:0 auto 12px; overflow:hidden; }
  .logo-img img{ width:100%; height:100%; object-fit:cover; }
  h1{ font-family:'Fraunces',serif; color:var(--navy); font-size:22px; }
  .sub{ color:var(--grey); font-size:13px; margin-top:6px; }
  label{ font-size:12.5px; font-weight:600; color:var(--navy); display:block; margin:16px 0 6px; }
  input{ width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid #E3E1DB; font-size:14px; font-family:'Inter'; }
  input:focus{ outline:none; border-color:var(--gold); }
  .btn{ width:100%; background:var(--navy); color:white; border:none; padding:14px; border-radius:14px; font-weight:700; font-size:14px; margin-top:22px; cursor:pointer; }
  .btn:disabled{ opacity:0.6; }
  .msg{ font-size:12.5px; margin-top:12px; text-align:center; }
  .msg.error{ color:var(--red); }
  .msg.success{ color:#2E8B57; }
  .switch{ text-align:center; margin-top:22px; font-size:13px; color:var(--grey); }
  .switch a{ color:var(--navy); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<div class="phone">
  <div class="logo-wrap">
    <div class="logo-img"><img src="logo.png" alt="logo"></div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to continue with Notes Wallah</p>
  </div>

  <label>Email</label>
  <input type="email" id="email" placeholder="you@example.com">
  <label>Password</label>
  <input type="password" id="password" placeholder="••••••••">

  <button class="btn" id="loginBtn" onclick="doLogin()">Log In</button>
  <div class="msg" id="msg"></div>

  <div style="display:flex; align-items:center; gap:10px; margin:18px 0;">
    <div style="flex:1; height:1px; background:#E3E1DB;"></div>
    <div style="font-size:11px; color:var(--grey);">OR</div>
    <div style="flex:1; height:1px; background:#E3E1DB;"></div>
  </div>

  <button class="btn" style="background:white; color:var(--navy); border:1.5px solid #E3E1DB;" onclick="googleLogin()">
    <span style="font-weight:700;">G</span>&nbsp; Continue with Google
  </button>

  <div class="switch">New here? <a href="signup.html">Create an account</a></div>
</div>

<script>
  async function googleLogin(){
    await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
  }
</script>

<script>
  async function doLogin(){
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('loginBtn');
    if(!email || !password){ msg.textContent = "Please enter email and password."; msg.className = "msg error"; return; }
    btn.disabled = true; btn.textContent = "Logging in...";
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = "Log In";
    if (error){ msg.textContent = error.message; msg.className = "msg error"; return; }
    window.location.href = "index.html";
  }
</script>
</body>
</html>
