<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --cream:#F7F5F0; --grey:#6B7280; --red:#C0392B; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--cream); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; padding:40px 24px; }
  .logo-wrap{ text-align:center; margin-bottom:32px; }
  .logo-img{ width:64px; height:64px; border-radius:16px; margin:0 auto 12px; overflow:hidden; }
  .logo-img img{ width:100%; height:100%; object-fit:cover; }
  h1{ font-family:'Fraunces',serif; color:var(--navy); font-size:22px; }
  .sub{ color:var(--grey); font-size:13px; margin-top:6px; }
  label{ font-size:12.5px; font-weight:600; color:var(--navy); display:block; margin:14px 0 6px; }
  input{ width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid #E3E1DB; font-size:14px; font-family:'Inter'; }
  input:focus{ outline:none; border-color:var(--gold); }
  .btn{ width:100%; background:var(--navy); color:white; border:none; padding:14px; border-radius:14px; font-weight:700; font-size:14px; margin-top:20px; cursor:pointer; }
  .btn:disabled{ opacity:0.6; }
  .msg{ font-size:12.5px; margin-top:12px; text-align:center; }
  .msg.error{ color:var(--red); }
  .msg.success{ color:#2E8B57; }
  .switch{ text-align:center; margin-top:20px; font-size:13px; color:var(--grey); }
  .switch a{ color:var(--navy); font-weight:700; text-decoration:none; }
</style>
</head>
<body>
<div class="phone">
  <div class="logo-wrap">
    <div class="logo-img"><img src="logo.png" alt="logo"></div>
    <h1>Create your account</h1>
    <p class="sub">Join Notes Wallah — it's free</p>
  </div>

  <label>Full Name</label>
  <input type="text" id="name" placeholder="Your name">
  <label>Email</label>
  <input type="email" id="email" placeholder="you@example.com">
  <label>Password</label>
  <input type="password" id="password" placeholder="At least 6 characters">

  <button class="btn" id="signupBtn" onclick="doSignup()">Create Account</button>
  <div class="msg" id="msg"></div>

  <div style="display:flex; align-items:center; gap:10px; margin:18px 0;">
    <div style="flex:1; height:1px; background:#E3E1DB;"></div>
    <div style="font-size:11px; color:var(--grey);">OR</div>
    <div style="flex:1; height:1px; background:#E3E1DB;"></div>
  </div>

  <button class="btn" style="background:white; color:var(--navy); border:1.5px solid #E3E1DB;" onclick="googleSignup()">
    <span style="font-weight:700;">G</span>&nbsp; Continue with Google
  </button>

  <div class="switch">Already have an account? <a href="login.html">Log In</a></div>
</div>

<script>
  async function googleSignup(){
    await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
  }
</script>

<script>
  async function doSignup(){
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('signupBtn');
    if(!name || !email || !password){ msg.textContent = "Please fill all fields."; msg.className="msg error"; return; }
    if(password.length < 6){ msg.textContent = "Password must be at least 6 characters."; msg.className="msg error"; return; }
    btn.disabled = true; btn.textContent = "Creating...";
    const { data, error } = await supabaseClient.auth.signUp({ email, password });
    if (error){ btn.disabled=false; btn.textContent="Create Account"; msg.textContent = error.message; msg.className="msg error"; return; }

    if (data.user) {
      await supabaseClient.from('profiles').insert({ id: data.user.id, name: name });
    }
    msg.textContent = "Account created! Redirecting...";
    msg.className = "msg success";
    setTimeout(() => window.location.href = "onboarding.html", 1200);
  }
</script>
</body>
</html>
