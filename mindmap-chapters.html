<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Mind Maps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --radius:16px; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; background:var(--cream); padding-bottom:90px; }
  h1{ font-family:'Fraunces', serif; }
  .topbar{ background:var(--navy); color:white; padding:16px 20px 20px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; cursor:pointer; text-decoration:none; color:white; }
  .topbar h1{ font-size:20px; font-weight:600; }
  .content{ padding:18px; }
  .chapter-card{ background:white; border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; align-items:center; gap:12px; margin-bottom:10px; text-decoration:none; color:var(--ink); }
  .ch-icon{ width:38px; height:38px; border-radius:10px; background:var(--cream); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .ch-info h4{ font-size:14px; font-weight:600; }
  .ch-info p{ font-size:11px; color:var(--grey); margin-top:2px; }
  .empty{ text-align:center; padding:50px 20px; color:var(--grey); font-size:13px; }
</style>
</head>
<body>
<script>if(localStorage.getItem('nw_dark_mode')==='1')document.body.classList.add('dark');</script>
<div class="phone">
  <div class="topbar">
    <a href="index.html" class="back-btn">←</a>
    <h1>Mind Maps</h1>
  </div>
  <div class="content" id="list"><div class="empty">Loading chapters with mind maps...</div></div>
</div>
<script>
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', session.user.id).single();
    const classBoard = `Class ${profile.class_selected} ${profile.board}`;
    const { data: subjects } = await supabaseClient.from('subjects').select('id, name').eq('class_board', classBoard);
    const list = document.getElementById('list');
    if (!subjects || subjects.length === 0) { list.innerHTML = '<div class="empty">No mind maps available for your class yet.</div>'; return; }

    const subjectIds = subjects.map(s => s.id);
    const { data: chapters } = await supabaseClient.from('chapters').select('id, title, subject_id').in('subject_id', subjectIds);
    if (!chapters) { list.innerHTML = '<div class="empty">No mind maps available yet.</div>'; return; }

    let anyFound = false;
    list.innerHTML = '';
    for (const ch of chapters) {
      const { count } = await supabaseClient.from('mind_maps').select('*', { count: 'exact', head: true }).eq('chapter_id', ch.id);
      if (count > 0) {
        anyFound = true;
        const subj = subjects.find(s => s.id === ch.subject_id);
        const a = document.createElement('a');
        a.href = `mindmap-viewer.html?chapter_id=${ch.id}`;
        a.className = 'chapter-card';
        a.innerHTML = `<div class="ch-icon">🧠</div><div class="ch-info"><h4>${ch.title}</h4><p>${subj?.name || ''} · ${count} mind map${count===1?'':'s'}</p></div>`;
        list.appendChild(a);
      }
    }
    if (!anyFound) list.innerHTML = '<div class="empty">No mind maps uploaded yet for your class. Check back soon!</div>';
  })();
</script>
</body>
</html>
