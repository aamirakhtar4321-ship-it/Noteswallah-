<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — My Certificates</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --gold-light:#F6D9A6; --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --radius:16px; --shadow: 0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; background:var(--cream); padding-bottom:90px; }
  h1{ font-family:'Fraunces', serif; }
  .topbar{ background:var(--navy); color:white; padding:16px 20px 20px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; cursor:pointer; text-decoration:none; color:white; }
  .topbar h1{ font-size:18px; font-weight:600; }
  .topbar p{ font-size:12px; color:var(--gold-light); margin-top:2px; }
  .content{ padding:18px; }
  .cert-card{ background:white; border-radius:var(--radius); box-shadow:var(--shadow); padding:16px; display:flex; align-items:center; gap:14px; margin-bottom:12px; text-decoration:none; color:var(--ink); }
  .cert-thumb{ width:52px; height:52px; border-radius:12px; flex-shrink:0; background:linear-gradient(160deg,var(--gold-light),var(--gold)); display:flex; align-items:center; justify-content:center; font-size:22px; }
  .cert-info{ flex:1; }
  .cert-info h4{ font-size:14px; font-weight:600; }
  .cert-info p{ font-size:11.5px; color:var(--grey); margin-top:3px; }
  .cert-grade{ font-size:10px; font-weight:700; background:var(--cream); color:var(--navy); padding:3px 9px; border-radius:8px; display:inline-block; margin-top:5px; }
  .empty{ text-align:center; padding:60px 20px; color:var(--grey); font-size:13px; }
  .bottom-nav{ position:fixed; bottom:0; width:100%; max-width:430px; background:white; border-top:1px solid #EEE; display:flex; justify-content:space-around; padding:10px 8px 14px; }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; font-weight:600; color:var(--grey); text-decoration:none; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar"><a href="profile.html" class="back-btn">←</a><div><h1>My Certificates</h1><p id="countLine"></p></div></div>
  <div class="content" id="list"><div class="empty">Loading...</div></div>
</div>
<div class="bottom-nav">
  <a href="index.html" class="nav-item">Home</a>
  <a href="subjects.html" class="nav-item">Notes</a>
  <a href="test-start.html" class="nav-item">Tests</a>
  <a href="doubts.html" class="nav-item">AI</a>
  <a href="profile.html" class="nav-item">Profile</a>
</div>
<script>
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    const { data: attempts } = await supabaseClient.from('test_attempts').select('*, chapters(title)').eq('user_id', session.user.id).order('created_at', { ascending: false });
    const passed = (attempts || []).filter(a => (a.score/a.total) >= 0.6);
    document.getElementById('countLine').textContent = `${passed.length} certificate${passed.length===1?'':'s'} earned`;
    const list = document.getElementById('list');
    if (passed.length === 0) { list.innerHTML = '<div class="empty">Pass any test with 60%+ to earn your first certificate!</div>'; return; }
    list.innerHTML = '';
    passed.forEach(a => {
      const percent = Math.round((a.score/a.total)*100);
      const grade = percent >= 90 ? 'Excellent' : percent >= 75 ? 'Very Good' : 'Good';
      const div = document.createElement('a');
      div.href = `certificate.html?chapter=${encodeURIComponent(a.chapters?.title||'')}&score=${a.score}&total=${a.total}&date=${a.created_at.slice(0,10)}`;
      div.className = 'cert-card';
      div.innerHTML = `<div class="cert-thumb">🏅</div><div class="cert-info"><h4>${a.chapters?.title || 'Chapter Test'}</h4><p>${percent}% score</p><div class="cert-grade">★ ${grade}</div></div>`;
      list.appendChild(div);
    });
  })();
</script>
</body>
</html>
