<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — My Certificates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132242; --navy-light:#1D3560; --gold:#E8A33D; --gold-light:#F6D9A6;
    --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --green:#2E8B57;
    --radius:16px; --shadow: 0 4px 16px rgba(19,34,66,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; background:var(--cream); padding-bottom:90px; }
  h1,h2,h3{ font-family:'Fraunces', serif; }
  .topbar{ background:var(--navy); color:white; padding:16px 20px 20px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; text-decoration:none; color:white; }
  .topbar h1{ font-size:19px; font-weight:600; }
  .topbar p{ font-size:12.5px; color:var(--gold-light); margin-top:2px; }
  .content{ padding:18px; }
  .cert-card{
    background:white; border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; display:flex; align-items:center; gap:14px; margin-bottom:12px;
    text-decoration:none; color:var(--ink);
  }
  .cert-thumb{
    width:52px; height:52px; border-radius:12px; flex-shrink:0;
    background:linear-gradient(160deg,var(--gold-light),var(--gold));
    display:flex; align-items:center; justify-content:center; font-size:22px;
  }
  .cert-info{ flex:1; }
  .cert-info h4{ font-size:14px; font-weight:600; }
  .cert-info p{ font-size:11.5px; color:var(--grey); margin-top:3px; }
  .cert-grade{
    font-size:10px; font-weight:700; background:var(--cream); color:var(--navy);
    padding:3px 9px; border-radius:8px; display:inline-block; margin-top:5px;
  }
  .chevron{ color:var(--grey); font-size:18px; }
  .empty-state{ text-align:center; padding:60px 20px; color:var(--grey); font-size:13px; }
  .bottom-nav{
    position:fixed; bottom:0; width:100%; max-width:430px; background:white;
    border-top:1px solid #EEE; display:flex; justify-content:space-around;
    padding:10px 0 14px; box-shadow:0 -4px 16px rgba(0,0,0,0.05);
  }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px; font-weight:600; color:var(--grey); text-decoration:none; cursor:pointer; }
  .nav-item.active{ color:var(--navy); }
  .nav-icon{ font-size:19px; }

  body.dark{ background:#0B1220; }
  body.dark .phone{ background:#0B1220; }
  body.dark .chapter-card, body.dark .cert-card, body.dark .note-card, body.dark .bottom-nav,
  body.dark .bubble.sara, body.dark .intro-card{ background:#16213E !important; box-shadow:none; }
  body.dark .chapter-card *, body.dark .cert-card *, body.dark .note-card *,
  body.dark .bubble.sara, body.dark .intro-card *{ color:#EDEDED !important; }
  body.dark .nav-item{ color:#9BA3B4 !important; }
  .bottom-nav{ justify-content:space-between; padding:10px 18px 14px; align-items:center; }
  .nav-center{ display:flex; align-items:center; justify-content:center; width:50px; height:50px; border-radius:50%; background:var(--navy); color:white; margin-top:-26px; box-shadow:0 6px 14px rgba(19,34,66,0.35); text-decoration:none; flex-shrink:0; }

  /* UNIVERSAL DARK MODE FIX — overrides core color variables so ALL text using them auto-fixes */
  body.dark{ --cream:#0B1220 !important; --ink:#EDEDED !important; --grey:#9BA3B4 !important; background:#0B1220 !important; }
  body.dark .phone{ background:#0B1220 !important; }
  body.dark .streak-card, body.dark .continue-card, body.dark .test-card, body.dark .rec-card,
  body.dark .challenge-card.weekly, body.dark .quick-item, body.dark .bottom-nav, body.dark .subject-card,
  body.dark .chapter-card, body.dark .note-body, body.dark .stat-box, body.dark .menu-card,
  body.dark .cert-card, body.dark .note-card, body.dark .attempt-card, body.dark .intro-card,
  body.dark .bubble.sara, body.dark .q-card, body.dark .q-block, body.dark .cert-frame,
  body.dark .card, body.dark .info-card{ background:#16213E !important; box-shadow:none !important; border-color:#243256 !important; }
  body.dark .nav-item{ color:#9BA3B4 !important; }
  body.dark .nav-item.active{ color:#EDEDED !important; }
</style>
</head>
<body>

</div>

<div class="bottom-nav">

  <a href="index.html" class="nav-center"><div class="nav-icon">🏠</div></a>

</body>
</html>
