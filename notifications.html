<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Notifications</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --cream:#F7F5F0; --grey:#6B7280; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--cream); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; }
  .topbar{ background:var(--navy); color:white; padding:16px 20px 20px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; cursor:pointer; text-decoration:none; color:white; }
  .topbar h1{ font-family:'Fraunces',serif; font-size:18px; }
  .content{ padding:18px; }
  .notif-card{ background:white; border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; }
  .notif-card.unread{ border-left:3px solid var(--gold); }
  .notif-icon{ width:36px; height:36px; border-radius:10px; background:var(--cream); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  .notif-info h4{ font-size:13px; font-weight:600; }
  .notif-info p{ font-size:11.5px; color:var(--grey); margin-top:3px; line-height:1.4; }
  .notif-time{ font-size:10px; color:#B0AEA6; margin-top:4px; }
  .empty{ text-align:center; padding:60px 20px; color:var(--grey); font-size:13px; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar"><a href="index.html" class="back-btn">←</a><h1>Notifications</h1></div>
  <div class="content" id="list"><div class="empty">Loading...</div></div>
</div>
<script>
  const ICONS = { daily:'📝', weekly:'🗓️', certificate:'🏆', pdf:'⬇️', feature:'✨' };
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    const { data: notifs } = await supabaseClient.from('notifications').select('*').eq('user_id', session.user.id).order('created_at', { ascending: false }).limit(50);
    const list = document.getElementById('list');
    if (!notifs || notifs.length === 0) { list.innerHTML = '<div class="empty">No notifications yet.</div>'; return; }
    list.innerHTML = notifs.map(n => `
      <div class="notif-card ${n.is_read ? '' : 'unread'}">
        <div class="notif-icon">${ICONS[n.type] || '🔔'}</div>
        <div class="notif-info">
          <h4>${n.title}</h4>
          <p>${n.body}</p>
          <div class="notif-time">${new Date(n.created_at).toLocaleString('en-IN', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}</div>
        </div>
      </div>`).join('');
    await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', session.user.id).eq('is_read', false);
  })();
</script>
</body>
</html>
