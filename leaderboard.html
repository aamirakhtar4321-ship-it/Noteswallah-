<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter', sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; padding-bottom:90px; }
  h1{ font-family:'Fraunces', serif; }
  .topbar{ background:var(--navy); color:white; padding:16px 20px 20px; border-radius:0 0 24px 24px; text-align:center; }
  .topbar h1{ font-size:19px; }
  .topbar p{ font-size:11.5px; color:#F6D9A6; margin-top:4px; }
  .content{ padding:18px; }
  .rank-card{ background:white; border-radius:14px; box-shadow:var(--shadow); padding:13px 16px; display:flex; align-items:center; gap:12px; margin-bottom:9px; }
  .rank-card.top1{ background:linear-gradient(135deg,#FFF4DE,#FFE8B8); border:1.5px solid var(--gold); }
  .rank-num{ width:30px; font-weight:700; font-family:'Fraunces'; color:var(--navy); text-align:center; }
  .rank-avatar{ width:36px; height:36px; border-radius:50%; background:var(--navy); color:white; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; }
  .rank-info{ flex:1; }
  .rank-info h4{ font-size:13.5px; font-weight:600; }
  .rank-xp{ font-size:13px; font-weight:700; color:var(--gold); }
  .empty{ text-align:center; padding:50px 20px; color:var(--grey); font-size:13px; }
  .bottom-nav{ position:fixed; bottom:0; width:100%; max-width:430px; background:white; border-top:1px solid #EEE; display:flex; justify-content:space-around; padding:10px 0 14px; }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; font-weight:600; color:var(--grey); text-decoration:none; }
  .nav-icon{ font-size:19px; }
</style>
</head>
<body>
<script>if(localStorage.getItem('nw_dark_mode')==='1')document.body.classList.add('dark');</script>
<div class="phone">
  <div class="topbar">
    <h1>🏆 Weekly Leaderboard</h1>
    <p>Resets every Monday · Top XP earners this week</p>
  </div>
  <div class="content" id="list"><div class="empty">Loading...</div></div>
</div>
<div class="bottom-nav">
  <a href="index.html" class="nav-item"><div class="nav-icon">🏠</div>Home</a>
  <a href="subjects.html" class="nav-item"><div class="nav-icon">📚</div>Notes</a>
  <a href="test-start.html" class="nav-item"><div class="nav-icon">📝</div>Tests</a>
  <a href="doubts.html" class="nav-item"><div class="nav-icon">🤖</div>AI</a>
  <a href="profile.html" class="nav-item"><div class="nav-icon">👤</div>Profile</a>
</div>
<script>
  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = "login.html"; return; }
    const { data: rows } = await supabaseClient.from('leaderboard').select('*').order('weekly_xp', { ascending: false }).limit(20);
    const list = document.getElementById('list');
    if (!rows || rows.length === 0) { list.innerHTML = '<div class="empty">No XP earned yet this week. Be the first!</div>'; return; }
    list.innerHTML = '';
    rows.forEach((r, i) => {
      const isMe = r.id === session.user.id;
      const div = document.createElement('div');
      div.className = 'rank-card' + (i === 0 ? ' top1' : '');
      div.innerHTML = `<div class="rank-num">${i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)}</div>
        <div class="rank-avatar">${(r.name||'S')[0].toUpperCase()}</div>
        <div class="rank-info"><h4>${r.name || 'Student'}${isMe ? ' (You)' : ''}</h4></div>
        <div class="rank-xp">${r.weekly_xp} XP</div>`;
      list.appendChild(div);
    });
  })();
</script>
</body>
</html>
