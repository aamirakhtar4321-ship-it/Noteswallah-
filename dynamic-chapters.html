<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes Wallah — Chapters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  :root{ --navy:#132242; --gold:#E8A33D; --cream:#F7F5F0; --ink:#1B1B1B; --grey:#6B7280; --green:#2E8B57; --radius:16px; --shadow:0 4px 16px rgba(19,34,66,0.08); }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--cream); color:var(--ink); display:flex; justify-content:center; }
  .phone{ width:100%; max-width:430px; min-height:100vh; background:var(--cream); padding-bottom:90px; }
  h1{ font-family:'Fraunces',serif; }
  .topbar{ background:var(--navy); color:white; padding:16px 20px 20px; border-radius:0 0 24px 24px; display:flex; align-items:center; gap:14px; }
  .back-btn{ width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,0.1); display:flex; align-items:center; justify-content:center; font-size:16px; cursor:pointer; text-decoration:none; color:white; }
  .topbar h1{ font-size:20px; font-weight:600; }
  .content{ padding:18px; }
  .chapter-card{ background:white; border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; display:flex; align-items:center; gap:12px; margin-bottom:10px; text-decoration:none; color:var(--ink); }
  .ch-num{ width:34px; height:34px; border-radius:10px; background:var(--cream); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--navy); flex-shrink:0; }
  .ch-info h4{ font-size:14.5px; font-weight:600; }
  .empty{ text-align:center; padding:50px 20px; color:var(--grey); font-size:13px; }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; }

  body.dark{ background:#0B1220; }
  body.dark .phone{ background:#0B1220; }
  body.dark .chapter-card, body.dark .cert-card, body.dark .note-card, body.dark .bottom-nav,
  body.dark .bubble.sara, body.dark .intro-card{ background:#16213E !important; box-shadow:none; }
  body.dark .chapter-card *, body.dark .cert-card *, body.dark .note-card *,
  body.dark .bubble.sara, body.dark .intro-card *{ color:#EDEDED !important; }
  body.dark /* UNIVERSAL DARK MODE FIX — overrides core color variables so ALL text using them auto-fixes */
  body.dark{ --cream:#0B1220 !important; --ink:#EDEDED !important; --grey:#9BA3B4 !important; background:#0B1220 !important; }
  body.dark .phone{ background:#0B1220 !important; }
  body.dark .streak-card, body.dark .continue-card, body.dark .test-card, body.dark .rec-card,
  body.dark .challenge-card.weekly, body.dark .quick-item, body.dark .bottom-nav, body.dark .subject-card,
  body.dark .chapter-card, body.dark .note-body, body.dark .stat-box, body.dark .menu-card,
  body.dark .cert-card, body.dark .note-card, body.dark .attempt-card, body.dark .intro-card,
  body.dark .bubble.sara, body.dark .q-card, body.dark .q-block, body.dark .cert-frame,
  body.dark .card, body.dark .info-card{ background:#16213E !important; box-shadow:none !important; border-color:#243256 !important; }
  body.dark body.dark   .bottom-nav{ position:fixed; bottom:0; width:100%; max-width:430px; background:white; border-top:1px solid #EEE; display:flex; justify-content:space-around; padding:10px 8px 14px; box-shadow:0 -4px 16px rgba(0,0,0,0.05); }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10.5px; font-weight:600; color:var(--grey); text-decoration:none; padding:6px 10px; border-radius:12px; }
  .nav-item.active{ background:#EEF1F8; color:var(--navy); }
  body.dark .nav-item.active{ background:#1D2A47 !important; }
</style>
</head>
<body>
<script>if(localStorage.getItem('nw_dark_mode')==='1')document.body.classList.add('dark');</script>
<div class="phone">
  <div class="topbar">
    <a href="subjects.html" class="back-btn">←</a>
    <div><h1 id="subjectTitle">Loading...</h1><p id="chapterCount" style="font-size:11.5px; color:#F6D9A6; margin-top:2px;"></p></div>
  </div>
  <div class="content" id="chapterList"><div class="empty">Loading chapters...</div></div>
</div>
<div class="bottom-nav">
  <a href="index.html" class="nav-item">
    <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>Home</a>
  <a href="subjects.html" class="nav-item">
    <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Notes</a>
  <a href="test-start.html" class="nav-item">
    <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tests</a>
  <a href="doubts.html" class="nav-item">
    <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><circle cx="8.5" cy="14" r="1.2" fill="currentColor" stroke="none"/><circle cx="15.5" cy="14" r="1.2" fill="currentColor" stroke="none"/><path d="M12 8V4M8 4h8"/></svg>AI</a>
  <a href="profile.html" class="nav-item">
    <svg class="nav-icon" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Profile</a>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const subjectId = params.get('subject_id');

  (async () => {
    const list = document.getElementById('chapterList');
    if (!subjectId) { list.innerHTML = '<div class="empty">No subject selected.</div>'; return; }

    const { data: subject } = await supabaseClient.from('subjects').select('*').eq('id', subjectId).single();
    document.getElementById('subjectTitle').textContent = subject ? subject.name : "Subject";

    const { data: chapters } = await supabaseClient.from('chapters').select('*').eq('subject_id', subjectId).order('order_index');

    if (!chapters || chapters.length === 0) {
      list.innerHTML = '<div class="empty">No chapters added yet for this subject. Check back soon!</div>';
      return;
    }

    document.getElementById('chapterCount').textContent = `${chapters.length} chapter${chapters.length === 1 ? '' : 's'}`;

    list.innerHTML = '';
    let lastSection = null;
    let num = 0;
    chapters.forEach((ch) => {
      if (ch.section && ch.section !== lastSection) {
        lastSection = ch.section;
        const header = document.createElement('div');
        header.style.cssText = 'font-size:12.5px; font-weight:700; color:var(--navy); text-transform:uppercase; letter-spacing:0.5px; margin:18px 2px 8px;';
        header.textContent = ch.section;
        list.appendChild(header);
      }
      num++;
      const a = document.createElement('a');
      a.href = `dynamic-note.html?chapter_id=${ch.id}`;
      a.className = 'chapter-card';
      a.innerHTML = `<div class="ch-num">${num}</div><div class="ch-info"><h4>${ch.title}</h4></div>`;
      list.appendChild(a);
    });
  })();
</script>
</body>
</html>
