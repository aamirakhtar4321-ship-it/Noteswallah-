<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes Wallah — Chapter</title>
<style>
body{margin:0;background:#F7F5F0;font-family:Arial;color:#1B1B1B;display:flex;justify-content:center}.phone{width:100%;max-width:430px;min-height:100vh}.top{background:#132242;color:white;padding:18px 20px;border-radius:0 0 24px 24px}.back{color:white;text-decoration:none;font-size:20px}.wrap{padding:18px}.box{background:white;border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(19,34,66,.08)}.tag{display:inline-block;background:#F7F5F0;color:#132242;padding:6px 9px;border-radius:20px;font-size:11px;font-weight:700}.meta{color:#6B7280;font-size:12px;margin:10px 0}.empty{line-height:1.6;color:#444;font-size:14px}.btn{display:inline-block;margin-top:12px;margin-right:7px;background:#132242;color:white;padding:10px 12px;border-radius:10px;text-decoration:none;font-size:12px;font-weight:700}
</style></head><body><div class="phone"><div class="top"><a id="back" class="back" href="subjects.html">←</a><h2 id="title">Chapter</h2><div id="section"></div></div><div class="wrap"><div class="box"><span class="tag">UNIQUE CHAPTER ID</span><div id="meta" class="meta"></div><h3 id="name"></h3><p class="empty">Actual NCERT-concept-based notes will be added in Part 6. Part 5 locks the chapter identity so one subject can never open another subject's chapter by mistake.</p><a class="btn" id="subjectLink" href="subjects.html">Back to Subject</a><a class="btn" href="test-start.html">Test Zone</a></div></div></div>
<script src="chapter-data.js"></script><script>
const id=new URLSearchParams(location.search).get('chapter');const x=(window.NOTES_WALLAH_CHAPTERS||[]).find(v=>v.id===id);
const pages={mathematics:'chapters.html',science:'science-chapters.html','social-science':'social-chapters.html',english:'english-chapters.html',hindi:'hindi-chapters.html'};
if(!x){document.getElementById('title').textContent='Chapter not found';document.getElementById('name').textContent='Invalid chapter ID';}
else{document.getElementById('title').textContent=x.subject==='hindi'?'हिंदी':x.subject.replace('-',' ');document.getElementById('section').textContent=x.section;document.getElementById('name').textContent=x.name;document.getElementById('meta').textContent='Chapter '+x.chapter_number+' · '+x.id;document.getElementById('back').href=pages[x.subject];document.getElementById('subjectLink').href=pages[x.subject];}
</script></body></html>
